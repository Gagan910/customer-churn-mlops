name: Canary Promotion

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "MLflow model version to promote"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Promote canary model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          python -c "from src.train import promote_canary_to_production; promote_canary_to_production('customer-churn-model', {'ready': True, 'model_version': '${MODEL_VERSION}'})"

      - name: Verify production alias
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          python -c "import mlflow; actual = str(mlflow.MlflowClient().get_model_version_by_alias('customer-churn-model', 'production').version); expected = '${MODEL_VERSION}'; print(f'Production model version: {actual}'); assert actual == expected, f'Expected production version {expected}, found {actual}'"