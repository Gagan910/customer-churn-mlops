name: Data Drift Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    outputs:
      retrain_required: ${{ steps.monitoring.outputs.retrain_required }}
      canary_ready: ${{ steps.monitoring.outputs.canary_ready }}
      canary_model_version: ${{ steps.monitoring.outputs.canary_model_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate production predictions
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          python monitoring/generate_predictions.py

      - name: Run drift monitoring
        id: monitoring
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          CANARY_MODEL_VERSION: "8"
        run: |
          python monitoring/monitor.py

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: monitoring/drift_report.html

  canary-evaluation:
    needs: monitor
    runs-on: ubuntu-latest

    steps:
      - name: Report canary decision
        env:
          CANARY_READY: ${{ needs.monitor.outputs.canary_ready }}
          CANARY_MODEL_VERSION: ${{ needs.monitor.outputs.canary_model_version }}
        run: |
          if [ "$CANARY_READY" = "true" ]; then
            echo "CANARY_READY: Canary v$CANARY_MODEL_VERSION passed all deployment checks."
          else
            echo "CANARY_NOT_READY: Canary v$CANARY_MODEL_VERSION has not passed all deployment checks."
          fi

  canary-promotion:
    needs: monitor
    if: needs.monitor.outputs.canary_ready == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Promote evaluated canary
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ needs.monitor.outputs.canary_model_version }}
        run: |
          python -c "from src.train import promote_canary_to_production; promote_canary_to_production('customer-churn-model', {'ready': True, 'model_version': '${MODEL_VERSION}'})"

      - name: Verify production alias
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ needs.monitor.outputs.canary_model_version }}
        run: |
          python -c "import mlflow; actual = str(mlflow.MlflowClient().get_model_version_by_alias('customer-churn-model', 'production').version); expected = '${MODEL_VERSION}'; print(f'Production model version: {actual}'); assert actual == expected, f'Expected production version {expected}, found {actual}'"

  retrain:
    needs: monitor
    if: needs.monitor.outputs.retrain_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain model
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m src.train