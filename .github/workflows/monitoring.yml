name: Data Drift Monitoring

on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force retraining and canary evaluation"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 9 * * *"

jobs:

  # ==================================================
  # 1. Monitoring
  # ==================================================

  monitor:
    runs-on: ubuntu-latest

    outputs:
      retrain_required: ${{ steps.monitoring.outputs.retrain_required }}
      canary_model_version: ${{ steps.monitoring.outputs.canary_model_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate production predictions
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MODEL_SOURCE: mlflow
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          CANARY_MODEL_VERSION: ${{ vars.CANARY_MODEL_VERSION }}
        run: |
          python monitoring/generate_predictions.py

      - name: Run drift monitoring
        id: monitoring
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MODEL_SOURCE: mlflow
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          CANARY_MODEL_VERSION: ${{ vars.CANARY_MODEL_VERSION }}
        run: |
          python monitoring/monitor.py

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: monitoring/drift_report.html

      - name: Upload monitoring prediction log
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-prediction-log
          path: data/processed/prediction_logs.csv


  # ==================================================
  # 2. Retrain and register candidate
  # ==================================================

  retrain:
    needs: monitor

    if: needs.monitor.outputs.retrain_required == 'true' || inputs.force_retrain == true

    runs-on: ubuntu-latest

    outputs:
      candidate_model_version: ${{ steps.retrain.outputs.candidate_model_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain and register candidate
        id: retrain
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          MODEL_VERSION=$(python -c "from src.train import train_model; print(train_model())" | tail -n 1)

          echo "Candidate model version: $MODEL_VERSION"

          echo "candidate_model_version=$MODEL_VERSION" >> "$GITHUB_OUTPUT"


  # ==================================================
  # 3. Configure Render canary
  # ==================================================

  configure-canary:
    needs:
      - retrain

    if: needs.retrain.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Configure Render canary model version
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dach63jm8hqs73aumrf0
          CANARY_MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
        run: |
          curl --fail-with-body \
            --request PUT \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"value\":\"${CANARY_MODEL_VERSION}\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/CANARY_MODEL_VERSION"

      - name: Deploy Render canary configuration
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dach63jm8hqs73aumrf0
        run: |
          response=$(curl --fail-with-body \
            --request POST \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")

          echo "Render deployment response:"
          echo "${response}"

          DEPLOY_ID=$(echo "${response}" | python -c "
          import json
          import sys

          response = json.load(sys.stdin)
          print(response['id'])
          ")

          echo "Render deploy ID: ${DEPLOY_ID}"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dach63jm8hqs73aumrf0
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          for i in {1..30}; do
            echo "Checking Render deployment ${DEPLOY_ID}..."

            response=$(curl --fail-with-body \
              --request GET \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")

            echo "${response}"

            status=$(echo "${response}" | python -c "import json,sys; print(json.load(sys.stdin)['status'])")

            echo "Deployment status: ${status}"

            if [ "${status}" = "live" ]; then
              echo "Render deployment is live."
              exit 0
            fi

            if [ "${status}" = "failed" ] || \
               [ "${status}" = "canceled" ] || \
               [ "${status}" = "deactivated" ]; then
              echo "Render deployment failed with status: ${status}"
              exit 1
            fi

            sleep 10
          done

          echo "Render deployment did not become live within the expected time."
          exit 1

      - name: Verify Render canary model
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
          CANARY_MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
        run: |
          response=$(curl --fail-with-body \
            "${RENDER_APP_URL}/health")

          echo "Health response:"
          echo "${response}"

          python -c "
          import json

          response = json.loads('''${response}''')

          expected = '${CANARY_MODEL_VERSION}'

          actual = str(
              response.get('canary_loaded_version')
          )

          loaded = response.get(
              'canary_model_loaded'
          )

          print(f'Canary loaded version: {actual}')
          print(f'Expected canary version: {expected}')
          print(f'Canary model loaded: {loaded}')

          assert loaded is True, (
              'Render canary model is not loaded.'
          )

          assert actual == expected, (
              f'Expected canary version {expected}, '
              f'found {actual}'
          )
          "


  # ==================================================
  # 4. Generate dedicated canary evaluation traffic
  # ==================================================

  canary-predictions:
    needs:
      - monitor
      - retrain
      - configure-canary

    if: needs.configure-canary.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download monitoring prediction log
        uses: actions/download-artifact@v4
        with:
          name: monitoring-prediction-log
          path: data/processed

      - name: Generate canary evaluation predictions
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MODEL_SOURCE: mlflow
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          CANARY_ENABLED: "true"
          CANARY_TRAFFIC_PERCENT: "100"
          CANARY_MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
          CANARY_EVALUATION_MODE: "true"
        run: |
          python monitoring/generate_predictions.py

      - name: Upload canary evaluation prediction log
        uses: actions/upload-artifact@v4
        with:
          name: canary-evaluation-prediction-log
          path: data/processed/prediction_logs.csv


  # ==================================================
  # 5. Canary evaluation
  # ==================================================

  canary-evaluation:
    needs:
      - retrain
      - configure-canary
      - canary-predictions

    if: needs.canary-predictions.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download canary evaluation prediction log
        uses: actions/download-artifact@v4
        with:
          name: canary-evaluation-prediction-log
          path: data/processed

      - name: Evaluate candidate as canary
        id: evaluate
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MODEL_SOURCE: mlflow
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          CANARY_MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
        run: |
          python -c "
          from monitoring.monitor import (
              load_canary_evaluation_data,
              calculate_model_metrics_by_version,
              evaluate_canary,
          )

          canary_data = load_canary_evaluation_data()

          metrics_by_version = calculate_model_metrics_by_version(
              canary_data
          )

          result = evaluate_canary(
              canary_data,
              metrics_by_version,
          )

          print('Canary evaluation result:')
          print(result)

          with open('$GITHUB_OUTPUT', 'a') as output:
              output.write(
                  'canary_ready='
                  + ('true' if result.get('ready', False) else 'false')
                  + '\n'
              )

          if not result.get('ready', False):
              raise SystemExit('Canary evaluation failed.')
          "


  # ==================================================
  # 6. Promote evaluated canary
  # ==================================================

  canary-promotion:
    needs:
      - retrain
      - canary-evaluation

    if: needs.canary-evaluation.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Promote evaluated canary
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          MODEL_SOURCE: mlflow
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
        run: |
          python -c "
          from src.train import promote_canary_to_production

          promote_canary_to_production(
              'customer-churn-model',
              {
                  'ready': True,
                  'model_version': '${MODEL_VERSION}',
              },
          )
          "

      - name: Verify production alias
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/Gagan910/customer-churn-mlops.mlflow
          MLFLOW_TRACKING_USERNAME: Gagan910
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
        run: |
          python -c "
          import mlflow

          mlflow.set_tracking_uri(
              '${MLFLOW_TRACKING_URI}'
          )

          client = mlflow.MlflowClient()

          actual = str(
              client.get_model_version_by_alias(
                  'customer-churn-model',
                  'production',
              ).version
          )

          expected = '${MODEL_VERSION}'

          print(f'Production model version: {actual}')

          assert actual == expected, (
              f'Expected production version {expected}, '
              f'found {actual}'
          )
          "

      - name: Reload Render production model
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "X-Admin-API-Key: ${ADMIN_API_KEY}" \
            "${RENDER_APP_URL}/admin/reload-model"

      - name: Verify Render serving version
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
          MODEL_VERSION: ${{ needs.retrain.outputs.candidate_model_version }}
        run: |
          response=$(curl --fail-with-body \
            "${RENDER_APP_URL}/health")

          echo "Health response:"
          echo "${response}"

          python -c "
          import json

          response = json.loads('''${response}''')

          actual = str(
              response.get('mlflow_production_version')
          )

          expected = '${MODEL_VERSION}'

          print(f'Serving production version: {actual}')
          print(f'Expected production version: {expected}')

          assert actual == expected, (
              f'Expected serving version {expected}, '
              f'found {actual}'
          )
          "